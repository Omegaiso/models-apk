  const labels = [['a','A · Nativo refinado','La evolución directa de la UI actual: superficies suaves, jerarquía clara, acento azul.'],['b','B · Centro de control','Más dashboard: estado arriba, métricas visibles y acciones agrupadas.'],['c','C · Consola técnica','Densa y transparente: tablas monoespaciadas, logs y datos crudos.']];
  stage.innerHTML = `<div class="intro"><div><h1>${page.label}</h1><p>Tres direcciones visuales para la misma página. Elige una base y la adapto a GTK4/libadwaita.</p></div><div class="legend"><span class="chip"><strong>3</strong> variantes</span><span class="chip">WCAG AA</span><span class="chip">sin emojis</span><span class="chip">dark + light</span></div></div>
    <div class="grid">${labels.map(([v,name,desc]) => `<div class="mock-wrap">${shell(page.id, v, page.render(v))}<div class="mock-label"><span><strong>${name}</strong><br><span class="tiny">${desc}</span></span><span class="tag">${v.toUpperCase()}</span></div></div>`).join('')}</div>
    <div class="section-head"><div><h2>Notas de implementación</h2><p>Estas piezas se traducen a GTK4: sidebar, cards, tablas, badges y toasts. Las variantes B y C pueden convivir: B para Inicio/Recursos y A para Aplicaciones/Integración.</p></div></div>
    <div class="note"><strong>Recomendación de dirección:</strong> A como base de toda la app (familiaridad con Adwaita/Breeze), B para Inicio, Recursos y Diagnóstico (más información visible), y C solo como vista “avanzada” de logs. La navegación lateral debe mantenerse fija y el contenido respirar más: 24–32 px de padding, cards de 12–16 px de radio y una sola acción primaria por bloque.<div class="note-grid"><div class="note-card"><b>Jerarquía</b><span>Sidebar 224 px, contenido máximo 1100 px, título 28–32 px, cuerpo 13–14 px.</span></div><div class="note-card"><b>Color</b><span>Un acento azul para acciones; verde solo estado OK; ámbar para warnings; rojo para destructivo.</span></div><div class="note-card"><b>Densidad</b><span>Listas de 52–60 px de alto; tarjetas de métricas en grid de 3; tablas con números tabulares.</span></div></div></div>`;
}
function renderResolution() {
  return `<div class="intro"><div><h1>Resolución de apps</h1><p>El problema no es el tamaño del monitor: es la densidad lógica (dp) del display virtual. Android dibuja para <b>dp</b>, no para píxeles. La ventana de 552×984 px a 240 dpi daba 368×656 dp (un teléfono pequeño); a 215 dpi da 411×732 dp, el ancho de un Pixel 6.</p></div><div class="legend"><span class="chip"><strong>411 dp</strong> ahora</span><span class="chip"><strong>360 dp</strong> compacto</span><span class="chip"><strong>600 dp</strong> tablet</span></div></div>
    <div class="resolution"><div class="lab"><h2>Calculadora de densidad</h2><p>El viewer debe calcular el DPI a partir del ancho real de la ventana y el ancho lógico objetivo. No escales el vídeo: deja que Android renderice al tamaño correcto.</p>
      <div class="profiles" id="profiles">
        <button class="profile" data-dp="360"><b>Compacto</b><span>Teléfono pequeño</span><code>360 dp</code></button>
        <button class="profile active" data-dp="411"><b>Cómodo</b><span>Recomendado</span><code>411 dp</code></button>
        <button class="profile" data-dp="600"><b>Tablet</b><span>Más espacio</span><code>600 dp</code></button>
      </div>
      <div class="slider"><label for="dp">Ancho lógico</label><input id="dp" type="range" min="320" max="800" value="411" step="1"><output id="dpOut">411 dp</output></div>
      <div class="formula">DPI = round(<b>ancho_ventana_px</b> × 160 / <b>ancho_dp</b>)<br><span id="formulaOut">552 × 160 / 411 → 215 dpi</span></div>
      <div class="slider"><label for="win">Ventana</label><input id="win" type="range" min="360" max="1200" value="552" step="1"><output id="winOut">552 px</output></div>
      <div class="res-notes"><div class="res-note"><b>Antes</b><span>900×1600/240 escalado a 552 px = 368 dp. Texto pequeño y layout apretado.</span></div><div class="res-note"><b>Ahora</b><span>552×984/215 = 411 dp. Mismo tamaño de ventana, UI legible y estándar.</span></div><div class="res-note"><b>Tablet</b><span>552×984/147 = 600 dp. Apps adaptativas, más contenido.</span></div></div>
    </div><div class="preview-wrap"><div class="phone"><div class="phone-inner" id="phonePreview"><div class="phone-title">F-Droid</div><div class="phone-sub">Apps · 2.0.3</div><div class="phone-card"><b>F-Droid</b><span>org.fdroid.fdroid</span></div><div class="phone-card"><b>Mornye</b><span>com.zarz.mornye</span></div><div class="phone-card"><b>Firefox</b><span>org.mozilla.firefox</span></div><div class="phone-btn">Abrir</div></div></div><div class="tiny muted">Vista aproximada del reflow</div></div></div>
    <div class="section-head"><div><h2>Regla para el viewer</h2><p>Objetivo por perfil; DPI calculado, no hardcodeado.</p></div></div>
    <div class="note"><strong>Implementado:</strong> display inicial de 552×984 a 215 dpi con <code>--flex-display</code>. El dpi queda fijo y el display cambia de píxeles con la ventana: al agrandarla crece el ancho lógico (más columnas), no el zoom. El texto se queda en ~19 px, legible sin reescalar el vídeo. Para una app de tablet, el mismo cálculo con 600 dp da 147 dpi.<div class="note-grid"><div class="note-card"><b>Compacto</b><span>360 dp · 552 px → 245 dpi · apps con mucho texto.</span></div><div class="note-card"><b>Cómodo</b><span>411 dp · 552 px → 215 dpi · recomendado para desktop.</span></div><div class="note-card"><b>Tablet</b><span>600 dp · 552 px → 147 dpi · más columnas, no más zoom.</span></div></div></div>`;
}
function bindResolution() {
  const dp = document.getElementById('dp'), win = document.getElementById('win');
  const set = () => {
    const dpv = +dp.value, winv = +win.value, dpi = Math.round(winv * 160 / dpv);
    document.getElementById('dpOut').value = `${dpv} dp`;
    document.getElementById('winOut').value = `${winv} px`;
    document.getElementById('formulaOut').textContent = `${winv} × 160 / ${dpv} → ${dpi} dpi`;
    document.querySelectorAll('.profile').forEach(p => p.classList.toggle('active', +p.dataset.dp === dpv));
    const preview = document.getElementById('phonePreview');
    preview.style.setProperty('--preview-font', `${Math.max(8, 168 / dpv).toFixed(2)}px`);
  };
  dp.addEventListener('input', set); win.addEventListener('input', set);
  document.querySelectorAll('.profile').forEach(p => p.addEventListener('click', () => { dp.value = p.dataset.dp; set(); }));
  set();
}
function renderNav(active) {
  const nav = document.getElementById('pageNav');
  nav.innerHTML = NAV.map(([id,label,ic]) => `<button type="button" data-page="${id}" ${active===id?'aria-current="page"':''}>${icon(ic,13)} ${label}</button>`).join('');
  nav.querySelectorAll('button').forEach(button => button.addEventListener('click', () => {
    const id = button.dataset.page;
    if (location.hash.slice(1) === id) { showPage(id); }
    else { location.hash = id; }
  }));
}
function showPage(id, smooth) {
  if (!NAV.some(([navId]) => navId === id)) id = 'inicio';
  if (id === 'resolucion') renderPage(null);
  else renderPage(PAGES.find(p => p.id === id));
  renderNav(id);
  if (smooth) window.scrollTo({ top: 0, behavior: 'smooth' });
}
window.addEventListener('hashchange', () => showPage(location.hash.slice(1), true));
document.getElementById('themeBtn').addEventListener('click', () => {
  const root = document.documentElement;
  root.dataset.theme = root.dataset.theme === 'dark' ? 'light' : 'dark';
  try { localStorage.setItem('models-apk-theme', root.dataset.theme); } catch (e) {}
});
try {
  const saved = localStorage.getItem('models-apk-theme');
  if (saved === 'light' || saved === 'dark') document.documentElement.dataset.theme = saved;
} catch (e) {}
showPage(location.hash.slice(1) || 'inicio');
</script>
</body>
